<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>智能计划教练</title>
<meta name="theme-color" content="#1a2332">
<meta name="description" content="陪你执行计划——根据每日完成率动态调整次日强度">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="智能计划教练">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<style>
:root{
  --bg:#1a2332; --bg2:#121924; --card:#243044; --card2:#2c3a52;
  --ink:#e8edf5; --sub:#8b9bb4; --line:#334155;
  --pri:#4ea8ff; --pri2:#7c8cff; --good:#3dd68c; --warn:#f0b429; --bad:#f07178;
  --shadow:0 8px 28px rgba(0,0,0,.28);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;overflow:hidden;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg2); color:var(--ink); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.app{max-width:480px;margin:0 auto;height:100%;background:var(--bg);
     display:flex;flex-direction:column;position:relative;overflow:hidden;}
.top{flex:0 0 auto;background:linear-gradient(160deg,#1e2b40 0%,#1a2332 55%,#15202e 100%);
     color:#fff;padding:16px 16px 20px;border-bottom:1px solid var(--line);}
.top .row{display:flex;justify-content:space-between;align-items:center;}
.brand{font-weight:800;font-size:17px;display:flex;align-items:center;gap:7px;}
.top-actions{display:flex;align-items:center;gap:8px;}
.icon-btn{width:36px;height:36px;border:none;border-radius:10px;background:rgba(255,255,255,.08);
          color:var(--ink);font-size:16px;cursor:pointer;font-family:inherit;}
.pts-chip{background:rgba(78,168,255,.18);border:1px solid rgba(78,168,255,.28);
          padding:6px 11px;border-radius:20px;font-weight:700;font-size:13px;color:#9fd0ff;}
.hero{display:flex;align-items:center;gap:14px;margin-top:14px;}
.ring{width:68px;height:68px;border-radius:50%;background:
      conic-gradient(var(--pri) var(--p,0deg),rgba(255,255,255,.1) 0);
      display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.ring .inner{width:52px;height:52px;border-radius:50%;background:#1a2332;
             display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;}
.hero .t1{font-size:12px;color:var(--sub);}
.hero .t2{font-size:18px;font-weight:800;margin-top:2px;}
.hero .t3{font-size:12px;color:var(--sub);margin-top:3px;}
.content{flex:1 1 auto;min-height:0;padding:16px 14px calc(88px + var(--safe-b));overflow-y:auto;-webkit-overflow-scrolling:touch;}
.sec-title{font-size:13px;font-weight:800;color:var(--sub);margin:4px 4px 10px;
           display:flex;justify-content:space-between;align-items:center;letter-spacing:.04em;}
.sec-title [data-action]{cursor:pointer;color:var(--pri);}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px;
      box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.04);}
.plan{display:flex;align-items:flex-start;gap:12px;border-left:4px solid var(--c,#4ea8ff);padding-left:10px;}
.plan .pi{flex:1;min-width:0;}
.plan .pn{font-weight:800;font-size:16px;}
.plan .pm{font-size:12px;color:var(--sub);margin-top:4px;display:flex;flex-wrap:wrap;gap:4px;}
.plan .pp{font-size:12px;color:var(--sub);margin-top:4px;}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;
       background:var(--card2);color:var(--sub);}
.mode-A{background:rgba(240,113,120,.16);color:#f07178;}
.mode-B{background:rgba(78,168,255,.16);color:#4ea8ff;}
.mode-C{background:rgba(61,214,140,.16);color:#3dd68c;}
.st-active{background:rgba(61,214,140,.16);color:#3dd68c;}
.st-paused{background:rgba(240,180,41,.16);color:#f0b429;}
.st-done{background:rgba(124,140,255,.16);color:#7c8cff;}
.st-expired{background:rgba(139,155,180,.2);color:#8b9bb4;}
.p0{background:rgba(240,113,120,.16);color:#f07178;}
.p1{background:rgba(240,180,41,.16);color:#f0b429;}
.p2{background:rgba(139,155,180,.2);color:#8b9bb4;}
.progress{height:8px;background:rgba(255,255,255,.08);border-radius:6px;overflow:hidden;margin-top:9px;}
.progress > i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--pri2));
              border-radius:6px;transition:width .35s ease;}
.wlegend{display:flex;gap:8px;margin-top:8px;font-size:11px;color:var(--sub);}
.wlegend span{display:flex;align-items:center;gap:4px;}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;}
.btn{border:none;border-radius:12px;padding:11px 14px;font-weight:700;font-size:14px;
     cursor:pointer;font-family:inherit;width:100%;color:var(--ink);}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn-pri{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;}
.btn-ghost{background:var(--card2);color:var(--ink);}
.btn-good{background:rgba(61,214,140,.18);color:#3dd68c;}
.btn-warn{background:rgba(240,180,41,.16);color:#f0b429;}
.btn-bad{background:rgba(240,113,120,.16);color:#f07178;}
.btn-row{display:flex;gap:8px;}
.btn-row .btn{width:auto;flex:1;}
.btn-sm{font-size:12px;padding:7px 10px;}
.task{padding:12px 0;border-bottom:1px solid var(--line);}
.task:last-child{border-bottom:none;}
.task-top{display:flex;align-items:flex-start;gap:10px;}
.chk{width:24px;height:24px;border-radius:8px;border:2px solid var(--pri);flex:0 0 auto;
     display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;
     background:transparent;margin-top:1px;}
.chk.partial{background:linear-gradient(90deg,var(--warn) 50%,transparent 50%);border-color:var(--warn);}
.chk.done{background:var(--good);border-color:var(--good);}
.task .tx{flex:1;font-size:14px;min-width:0;}
.task.done .tx .tn{text-decoration:line-through;color:var(--sub);}
.tn{font-weight:650;}
.tm{font-size:12px;color:var(--sub);margin-top:3px;display:flex;flex-wrap:wrap;gap:4px;align-items:center;}
.task-states{display:flex;gap:6px;margin-top:10px;padding-left:34px;}
.st-btn{flex:1;border:1px solid var(--line);background:transparent;color:var(--sub);
        border-radius:9px;padding:6px 4px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;}
.st-btn.on-none{border-color:var(--sub);color:var(--ink);background:rgba(139,155,180,.12);}
.st-btn.on-partial{border-color:var(--warn);color:#f0b429;background:rgba(240,180,41,.12);}
.st-btn.on-done{border-color:var(--good);color:#3dd68c;background:rgba(61,214,140,.12);}
.empty{text-align:center;color:var(--sub);padding:28px 10px;font-size:14px;}
.empty .big{font-size:42px;margin-bottom:8px;}
.empty-guide{text-align:center;padding:48px 20px 32px;}
.empty-guide-icon{font-size:68px;line-height:1;margin-bottom:16px;}
.empty-guide-title{font-size:22px;font-weight:800;margin:0 0 10px;}
.empty-guide-desc{font-size:14px;color:var(--sub);line-height:1.65;margin:0 auto 26px;max-width:300px;}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);
     width:100%;max-width:480px;background:#1e2a3d;border-top:1px solid var(--line);
     display:flex;padding:6px 4px var(--safe-b);box-shadow:0 -8px 24px rgba(0,0,0,.25);z-index:20;}
.nav button{flex:1;background:none;border:none;font-family:inherit;color:var(--sub);
            font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;
            padding:6px 0;cursor:pointer;}
.nav button .ic{font-size:18px;line-height:1;}
.nav button.on{color:var(--pri);font-weight:800;}
.ov{position:fixed;inset:0;background:rgba(8,12,20,.72);display:none;align-items:flex-end;
    justify-content:center;padding:0;z-index:50;backdrop-filter:blur(6px);}
.ov.show{display:flex;}
.modal{background:var(--card);border-radius:20px 20px 0 0;padding:22px 18px calc(22px + var(--safe-b));
       width:100%;max-width:480px;max-height:90vh;overflow-y:auto;box-shadow:0 -18px 50px rgba(0,0,0,.4);}
@media(min-width:520px){
  .ov{align-items:center;padding:22px;}
  .modal{border-radius:20px;max-width:400px;}
}
.modal h3{margin:0 0 6px;font-size:18px;text-align:center;}
.modal .sub{text-align:center;color:var(--sub);font-size:13px;margin-bottom:14px;}
.reward{display:flex;align-items:center;gap:12px;background:var(--card2);
        border-radius:14px;padding:12px;margin-bottom:10px;}
.reward .em{font-size:28px;}
.reward .rt{font-weight:800;}
.reward .rd{font-size:12px;color:var(--sub);}
.celeb{text-align:center;}
.celeb .em{font-size:52px;animation:pop .5s ease;}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1)}}
.wall{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.ttl{background:var(--card2);border-radius:14px;padding:12px 4px;text-align:center;
     border:2px solid transparent;}
.ttl.on{background:linear-gradient(160deg,#2a3348,#3a2f1e);border-color:#f0b429;}
.ttl .te{font-size:26px;}
.ttl .tn{font-size:11px;font-weight:700;margin-top:4px;}
.ttl .tc{font-size:10px;color:var(--sub);margin-top:2px;}
.ttl.off{opacity:.42;filter:grayscale(.7);}
.exchange{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);}
.exchange:last-child{border-bottom:none;}
.field{margin-bottom:13px;}
.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px;color:var(--sub);}
.field input,.field textarea,.field select{
  width:100%;border:1.5px solid var(--line);border-radius:11px;padding:11px;
  font-size:14px;font-family:inherit;background:var(--bg);color:var(--ink);}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--pri);}
.seg{display:flex;gap:8px;}
.seg button{flex:1;border:1.5px solid var(--line);background:var(--bg);border-radius:11px;
     padding:10px 4px;font-size:12px;font-weight:700;color:var(--sub);cursor:pointer;font-family:inherit;}
.seg button.sel{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;border-color:transparent;}
.hint{font-size:12px;color:var(--sub);background:var(--card2);border-radius:11px;padding:10px;margin-bottom:12px;}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.stat{background:var(--card);border-radius:14px;padding:12px;text-align:center;border:1px solid rgba(255,255,255,.04);}
.stat .v{font-size:22px;font-weight:800;color:var(--pri);}
.stat .l{font-size:12px;color:var(--sub);margin-top:2px;}
.rest-banner{background:rgba(240,180,41,.12);color:#f0b429;border:1px solid rgba(240,180,41,.28);
             border-radius:12px;padding:12px;font-size:13px;margin-bottom:12px;}
.half-banner{background:rgba(78,168,255,.12);color:#9fd0ff;border:1px solid rgba(78,168,255,.28);
             border-radius:12px;padding:11px;font-size:13px;margin-bottom:12px;}
svg text{font-family:inherit;fill:var(--sub);}
.edit-row{display:flex;gap:6px;align-items:center;margin-bottom:6px;}
.er-input{flex:1;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;
          font-family:inherit;outline:none;background:var(--bg);color:var(--ink);min-width:0;}
.er-min{width:56px;flex:0 0 auto;}
.er-pri{width:64px;flex:0 0 auto;}
.er-del{width:30px;height:30px;border:none;border-radius:8px;background:var(--card2);color:#f07178;
        font-size:16px;cursor:pointer;flex:0 0 auto;}
.ai-loading{text-align:center;padding:36px 10px;}
.ai-loading .loading-em{font-size:48px;animation:spin 1.4s linear infinite;display:inline-block;}
@keyframes spin{to{transform:rotate(360deg)}}
.plan-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
#hPts{display:inline-block;}
#hPts.pts-pop{animation:ptsBounce .3s ease;}
@keyframes ptsBounce{0%,100%{transform:scale(1)}50%{transform:scale(1.28)}}
.adj-row{display:flex;justify-content:space-between;font-size:13px;padding:8px 0;border-bottom:1px solid var(--line);}
.adj-row:last-child{border-bottom:none;}
.toast{position:fixed;bottom:calc(90px + var(--safe-b));left:50%;transform:translateX(-50%);
       background:#0d141f;color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;
       z-index:99;box-shadow:0 6px 20px rgba(0,0,0,.4);max-width:86%;text-align:center;}
.rule{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;}
.rule:last-child{border-bottom:none;}
.rule .pts{color:var(--pri);font-weight:800;}
.tab-pill{display:flex;background:var(--card2);border-radius:20px;padding:3px;margin-bottom:12px;}
.tab-pill button{flex:1;border:none;background:none;font-family:inherit;font-size:13px;font-weight:700;
                 color:var(--sub);padding:8px 10px;border-radius:16px;cursor:pointer;}
.tab-pill button.sel{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;}
.inc-item{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);align-items:flex-start;}
.inc-item:last-child{border-bottom:none;}
.inc-item .inc-main{flex:1;min-width:0;}
.inc-item .inc-name{font-weight:800;font-size:14px;}
.inc-item .inc-desc{font-size:12px;color:var(--sub);margin-top:3px;}
.inc-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
.inc-tag{font-size:10px;padding:2px 8px;border-radius:8px;background:var(--card2);color:var(--sub);}
.inc-tag.val{color:var(--pri);background:rgba(78,168,255,.16);font-weight:700;}
.inc-actions{display:flex;flex-direction:column;gap:4px;flex:0 0 auto;}
.inc-search{width:100%;border:1.5px solid var(--line);border-radius:11px;padding:10px 12px;
            font-size:14px;font-family:inherit;background:var(--bg);color:var(--ink);margin-bottom:10px;}
.inc-empty{text-align:center;color:var(--sub);padding:24px 10px;font-size:13px;}
.weight-row{display:flex;align-items:center;gap:8px;margin-top:8px;}
.weight-row input[type=range]{flex:1;accent-color:var(--pri);}
.weight-val{font-size:12px;font-weight:800;color:var(--pri);min-width:28px;text-align:center;}
.filter-pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
.filter-pill{border:1.5px solid var(--line);background:var(--bg);border-radius:20px;padding:6px 10px;
             font-size:12px;font-weight:700;color:var(--sub);cursor:pointer;font-family:inherit;}
.filter-pill.sel{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;border-color:transparent;}
.mini{width:28px;height:28px;border:none;border-radius:8px;background:var(--card2);color:var(--pri);
      font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;}
.mini.del{color:var(--bad);}
.rec-card{background:var(--card2);border-radius:14px;padding:12px;margin-bottom:10px;text-align:left;}
.week-acc{border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg);}
.week-hd{width:100%;border:none;background:transparent;color:var(--ink);font-family:inherit;text-align:left;
         padding:12px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;font-weight:700;}
.week-bd{padding:0 12px 12px;display:none;}
.week-acc.open .week-bd{display:block;}
.day-block{background:var(--card2);border-radius:10px;padding:10px;margin-top:8px;}
.day-block .dh{font-size:12px;font-weight:800;color:var(--sub);margin-bottom:6px;display:flex;justify-content:space-between;}
.diff-pills{display:flex;gap:4px;}
.diff-pills i{width:8px;height:8px;border-radius:50%;background:var(--line);display:inline-block;}
.diff-pills i.on{background:var(--pri);}
.type-tag{font-size:10px;padding:2px 7px;border-radius:8px;background:rgba(78,168,255,.14);color:#9fd0ff;}
.task-tools{display:flex;gap:6px;margin-top:8px;padding-left:34px;flex-wrap:wrap;}
.task[draggable="true"]{cursor:grab;}
.task.drag-over{outline:1px dashed var(--pri);border-radius:10px;}
.hier-step{font-size:12px;color:var(--sub);margin:10px 0 6px;font-weight:800;}
.log-item{font-size:12px;color:var(--sub);padding:6px 0;border-bottom:1px solid var(--line);}
.task.skip .tn{opacity:.65;}
.task.skip{opacity:.88;}
.task-edit{margin-bottom:8px;}
.er-subs{width:100%;margin-top:4px;}
.subtasks{margin:4px 0 0 34px;}
.subtask{display:flex;align-items:flex-start;gap:8px;padding:4px 0;font-size:13px;}
.subtask .stxt{flex:1;min-width:0;}
.subtask.done .stxt{text-decoration:line-through;color:var(--sub);}
.chk.sm{width:18px;height:18px;border-radius:6px;font-size:11px;margin-top:1px;}
.fb-line{margin:0 0 4px 34px;font-size:12px;color:#9fd0ff;}
.plan-tabs{display:flex;gap:8px;margin-bottom:12px;}
.plan-tabs button{flex:1;}
.sum-block{font-size:13px;white-space:pre-wrap;line-height:1.65;}
.pending-banner{background:rgba(124,140,255,.14);color:#c9d0ff;border:1px solid rgba(124,140,255,.35);
  border-radius:12px;padding:12px;font-size:13px;margin-bottom:12px;}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="row">
      <div class="brand">🎯 智能计划教练</div>
      <div class="top-actions">
        <button class="icon-btn" data-action="open-settings" title="设置">⚙</button>
        <div class="pts-chip">⭐ <span id="hPts">0</span></div>
      </div>
    </div>
    <div class="hero">
      <div class="ring" id="hRing"><div class="inner" id="hRingTxt">0%</div></div>
      <div>
        <div class="t1">当前称号</div>
        <div class="t2" id="hTitle">🌱 新手启程</div>
        <div class="t3" id="hProg">今日加权进度：0%</div>
      </div>
    </div>
  </div>
  <div class="content" id="content"></div>
  <div class="nav" id="nav">
    <button data-view="home" class="on"><span class="ic">🏠</span>首页</button>
    <button data-view="today"><span class="ic">✅</span>今日</button>
    <button data-view="plans"><span class="ic">📋</span>计划</button>
    <button data-view="rewards"><span class="ic">🎁</span>激励</button>
    <button data-view="stats"><span class="ic">📈</span>数据</button>
  </div>
</div>
<div class="ov" id="ov"><div class="modal" id="modal"></div></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>
<input type="file" id="incDocxFile" accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document" hidden>
<script src="https://cdn.jsdelivr.net/npm/mammoth@1.11.0/mammoth.browser.min.js" onerror="window.__mammothFailed=1"></script>
<script>
/* ============ DeepSeek API 配置 ============ */
const DEEPSEEK_API_KEY=''; // 留空。Key 只在设置页填写，不要写进安装包。
const DEEPSEEK_API_URL='https://api.deepseek.com/v1/chat/completions';

/* ============ 常量 ============ */
const KEY='smartPlanCoach.v1';
const CYCLE_DAYS={日:1,周:7,月:30,半年:180,年:365,一年:365};
const CYCLE_MONTHS={半年:6,一年:12,年:12};
const PW={P0:0.6,P1:0.3,P2:0.1};
const SV={done:1,partial:0.5,none:0};
const UP={A:1.15,B:1.1,C:1.05};
const DOWN={A:0.85,B:0.9,C:0.95};
const MODES={
  A:{label:'激进',cls:'mode-A',up:'+15%',down:'-15%'},
  B:{label:'稳健',cls:'mode-B',up:'+10%',down:'-10%'},
  C:{label:'保守',cls:'mode-C',up:'+5%',down:'-5%'}
};
const STATUS_MAP={
  active:{label:'进行中',cls:'st-active'},
  paused:{label:'已暂停',cls:'st-paused'},
  done:{label:'已完成',cls:'st-done'},
  expired:{label:'已过期',cls:'st-expired'}
};
const TITLE_DEFS=[
  {e:'🌱',n:'新手启程',c:'默认解锁'},
  {e:'🔥',n:'连击达人',c:'连续3天满分'},

function clampDiff(n){n=parseInt(n,10);if(isNaN(n))return 3;return Math.min(5,Math.max(1,n));}
function inferType(name,category){
  const t=String(name||'');
  if(/(跑|健身|力量|有氧|拉伸|运动|步数|训练|瑜伽)/i.test(t)||category==='健身')return '运动';
  if(/(学|词|阅读|英语|笔记|练习|考试|编程|听|写)/i.test(t)||category==='学习')return '学习';
  if(/(项目|沟通|交付|工作|开发|汇报)/i.test(t)||category==='工作')return '工作';
  if(category==='其他'||/(整理|休息|习惯|心情)/i.test(t))return '生活';
  return TASK_TYPES.includes(category)?category:'其他';
}
function normalizeTaskFields(t,plan){
  if(!t.priority)t.priority='P1';
  if(!t.minutes)t.minutes='30';
  t.difficulty=clampDiff(t.difficulty);
  t.type=t.type&&TASK_TYPES.includes(t.type)?t.type:inferType(t.text,plan&&plan.category);
  if(t.skipped==null)t.skipped=false;
  if(t.extra==null)t.extra=false;
  if(t.order==null)t.order=0;
  if(!t.source)t.source='coach';
  if(!Array.isArray(t.subtasks))t.subtasks=[];
  t.subtasks=t.subtasks.map(s=>{
    if(typeof s==='string')return {id:uid(),text:s,done:false};
    return {id:s.id||uid(),text:String(s.text||'').trim(),done:!!s.done};
  }).filter(s=>s.text);
  return t;
}
function ensurePlanHierarchy(p){
  if(!p.month_plan||typeof p.month_plan!=='object'||Array.isArray(p.month_plan))p.month_plan={};
  if(!p.week_plan||typeof p.week_plan!=='object'||Array.isArray(p.week_plan))p.week_plan={};
  return p;
}
function migrate(){
  S.version=5;
  S.plans=(S.plans||[]).filter(p=>p&&typeof p==='object');
  S.plans.forEach(p=>{
    try{
    if(!p.id)p.id=uid();
    if(!p.name)p.name=p.title||p.goal||'未命名计划';
    if(!p.goal)p.goal=p.desc||p.description||p.name;
    if(!p.createdAt||!/^\d{4}-\d{2}-\d{2}$/.test(String(p.createdAt)))p.createdAt=todayStr();
    if(!p.status)p.status='active';
    if(p.intensity==null||isNaN(Number(p.intensity)))p.intensity=1;
    if(p.cycle==='年')p.cycle='一年';
    if(!p.cycle)p.cycle='月';
    if(!p.mode||!MODES[p.mode])p.mode='B';
    if(!p.color)p.color=pickColor();
    if(p.monthPlan&&!p.month_plan)p.month_plan=p.monthPlan;
    if(p.weekPlan&&!p.week_plan)p.week_plan=p.weekPlan;
    if(!p.profile||typeof p.profile!=='object')p.profile={dailyMinutes:60,foundation:'',preference:''};
    p.profile.dailyMinutes=Math.max(15,parseInt(p.profile.dailyMinutes,10)||60);
    p.profile.foundation=p.profile.foundation||'';
    p.profile.preference=p.profile.preference||'';
    if(Array.isArray(p.templates)&&p.templates.length&&typeof p.templates[0]==='string'){
      p.templates=p.templates.map(parseTaskLine).filter(Boolean);
    }
    (p.templates||[]).forEach(t=>{
      if(t.name&&!t.text)t.text=t.name;
      t.difficulty=clampDiff(t.difficulty);
      t.type=t.type||inferType(t.name||t.text,p.category);
    });
    ensurePlanHierarchy(p);
    refreshPlanStatus(p);
    }catch(e){console.warn('计划兼容失败',p&&p.name,e);}
  });
  if(!S.tasks||typeof S.tasks!=='object'||Array.isArray(S.tasks))S.tasks={};
  Object.keys(S.tasks).forEach(d=>{
    if(!Array.isArray(S.tasks[d])){delete S.tasks[d];return;}
    S.tasks[d]=S.tasks[d].filter(t=>t&&typeof t==='object');
    S.tasks[d].forEach((t,i)=>{
      try{
      if(!t.id)t.id=uid();
      if(!t.text)t.text=t.name||t.content||t.title||'未命名任务';
      if(!t.date)t.date=d;
      if(!t.status)t.status=t.done?'done':'none';
      if(/\|/.test(t.text||'')){
        const parsed=parseTaskLine(t.text);
        if(parsed){
        t.text=parsed.name;
        if(!t.priority)t.priority=parsed.priority;
        if(!t.minutes)t.minutes=parsed.minutes;
        if(!t.difficulty)t.difficulty=parsed.difficulty;
        if(!t.type)t.type=parsed.type;
        if(parsed.subtasks&&parsed.subtasks.length&&!(t.subtasks&&t.subtasks.length))t.subtasks=parsed.subtasks;
        }
      }
      if(!t.priority){
        const m=String(t.text||'').match(/\b(P0|P1|P2)\b/i);
        t.priority=m?m[1].toUpperCase():'P1';
      }
      if(!t.minutes){
        const m=String(t.text||'').match(/(\d+)\s*分/);
        t.minutes=m?m[1]:'30';
      }
      if(t.order==null)t.order=i;
      normalizeTaskFields(t,planById(t.planId));
      }catch(e){console.warn('任务兼容失败',d,e);}
    });
  });
  if(!S.settlements||typeof S.settlements!=='object'||Array.isArray(S.settlements))S.settlements={};
  Object.keys(S.settlements).forEach(d=>{
    const rec=S.settlements[d];
    if(!rec||typeof rec!=='object'){delete S.settlements[d];return;}
    if(rec.rate==null&&rec.completionRate!=null)rec.rate=rec.completionRate;
    if(typeof rec.rate==='string'&&rec.rate.trim())rec.rate=Number(rec.rate);
    if(typeof rec.rate==='number'&&rec.rate>1&&rec.rate<=100)rec.rate=rec.rate/100;
    if(rec.rest==null)rec.rest=rec.type==='rest';
    if(!rec.changeLog)rec.changeLog=S.changeLogs[d]||[];
  });
  if(!S.stats||typeof S.stats!=='object')S.stats=defState().stats;
  else S.stats=Object.assign(defState().stats,S.stats);
  if(!Array.isArray(S.titles)||!S.titles.length)S.titles=['🌱 新手启程'];
  else if(!S.titles.some(t=>String(t).includes('新手启程')))S.titles.unshift('🌱 新手启程');
  if(!Array.isArray(S.achievements))S.achievements=[];
  if(!Array.isArray(S.weeklyDone))S.weeklyDone=[];
  if(!Array.isArray(S.monthlyDone))S.monthlyDone=[];
  if(!S.weeklyAvg||typeof S.weeklyAvg!=='object'||Array.isArray(S.weeklyAvg))S.weeklyAvg={};
  if(!S.monthlyAvg||typeof S.monthlyAvg!=='object'||Array.isArray(S.monthlyAvg))S.monthlyAvg={};
  Object.keys(S.weeklyAvg).forEach(k=>{const n=coerceRate(S.weeklyAvg[k]);if(n==null)delete S.weeklyAvg[k];else S.weeklyAvg[k]=n;});
  Object.keys(S.monthlyAvg).forEach(k=>{const n=coerceRate(S.monthlyAvg[k]);if(n==null)delete S.monthlyAvg[k];else S.monthlyAvg[k]=n;});
  if(!Array.isArray(S.exLog))S.exLog=[];
  const pts=coerceNumber(S.points);
  S.points=pts==null?0:pts;
}

function calcValueScore(item){
  const price=Number(item.price)||0;
  const weight=Math.min(10,Math.max(1,Number(item.weight)||5));
  return price*weight*0.1;
}
function normalizeIncentive(item){
  if(!item.id)item.id=uid();
  item.weight=Math.min(10,Math.max(1,Number(item.weight)||5));
  item.price=Number(item.price)||0;
  item.type=item.type||'通用';
  item.desc=item.desc||'';
  item.name=item.name||'';
  item.valueScore=calcValueScore(item);
  return item;
}
function ensureIncentiveData(){
  if(!Array.isArray(S.incentives))S.incentives=[];
  if(!S.rewardEngine||typeof S.rewardEngine!=='object'){
    S.rewardEngine={totalCompleted:0,lastCountMilestone:0,weekEngine:{},monthEngine:{}};
  }
  if(!S.rewardEngine.weekEngine)S.rewardEngine.weekEngine={};
  if(!S.rewardEngine.monthEngine)S.rewardEngine.monthEngine={};
  S.incentives.forEach(normalizeIncentive);
  if(!S.rewardEngine._synced){
    let total=0;
    Object.keys(S.tasks||{}).forEach(d=>(S.tasks[d]||[]).forEach(t=>{
      if(t.status==='done'||t.done)total++;
    }));
    S.rewardEngine.totalCompleted=Math.max(S.rewardEngine.totalCompleted||0,total);
    S.rewardEngine.lastCountMilestone=Math.floor((S.rewardEngine.totalCompleted||0)/10)*10;
    S.rewardEngine._synced=true;
  }
}
function isIncentiveHeaderLine(line){
  const s=String(line).trim();
  return /激励名称/.test(s)&&/描述/.test(s);
}
function parseIncentiveLine(line){
  const parts=String(line).split('|').map(s=>s.trim());
  if(parts.length<4)return null;
  const [name,desc,priceStr,type]=parts;
  if(!name||isIncentiveHeaderLine(line))return null;
  const price=parseFloat(String(priceStr).replace(/[^\d.]/g,''))||0;
  const weight=parts[4]?Math.min(10,Math.max(1,parseInt(parts[4],10)||5)):5;
  return normalizeIncentive({id:uid(),name,desc,price,type:type||'通用',weight});
}
function parseIncentiveText(text){
  const items=[];
  String(text).split(/\r?\n/).forEach(line=>{
    const item=parseIncentiveLine(line);
    if(item)items.push(item);
  });
  return items;
}
async function docxToText(file){
  if(typeof mammoth==='undefined')throw new Error('mammoth.js 未加载，请检查网络');
  const buf=await file.arrayBuffer();
  const raw=await mammoth.extractRawText({arrayBuffer:buf});
  let text=(raw&&raw.value)||'';
  const htmlRes=await mammoth.convertToHtml({arrayBuffer:buf});
  const div=document.createElement('div');
  div.innerHTML=(htmlRes&&htmlRes.value)||'';
  const tableLines=[];
  Array.from(div.querySelectorAll('tr')).forEach(tr=>{
    const cells=Array.from(tr.querySelectorAll('td,th')).map(td=>td.innerText.replace(/\s+/g,' ').trim());
    if(cells.length>=4)tableLines.push(cells.join(' | '));
  });
  if(tableLines.length)text=tableLines.join('\n')+'\n'+text;
  if(!text.trim()){
    text=Array.from(div.querySelectorAll('p,li')).map(el=>el.innerText.trim()).filter(Boolean).join('\n');
  }
  return text;
}
async function importIncentivesFromDocx(file){
  const text=await docxToText(file);
  const items=parseIncentiveText(text);
  if(!items.length){toast('未解析到有效激励，请确认每行用 | 分隔');return;}
  S.incentives=S.incentives.concat(items);
  save();
  rewardsTab='library';
  view='rewards';
  render();
  toast('已导入 '+items.length+' 条激励');
}

}

function incentiveCost(item){return Math.max(1,Math.round(calcValueScore(item)));}

function weightedRate(tasks){
  const usable=(tasks||[]).filter(t=>!t.skipped);
  if(!usable.length)return 1;
  const groups={P0:[],P1:[],P2:[]};
  usable.forEach(t=>{const p=['P0','P1','P2'].includes(t.priority)?t.priority:'P1';groups[p].push(t);});
  let totalW=0,earned=0;
  ['P0','P1','P2'].forEach(p=>{
    const arr=groups[p];if(!arr.length)return;
    const w=PW[p];totalW+=w;
    const avg=arr.reduce((s,t)=>s+SV[t.status||'none'],0)/arr.length;
    earned+=w*avg;
  });
  return totalW?earned/totalW:1;
}

});}

}

function parseTaskLine(line){
  const parts=String(line).replace(/^[-*•\d.\s]+/,'').split('|').map(s=>s.trim());
  const tag=(parts[0]||'').toUpperCase();
  if(['GOAL','FOCUS','THEME','DAY','REASON','目标','重点','主题','日期','说明'].includes(tag))return null;
  const name=parts[0]||'未命名任务';
  if(name.length>180)return null;
  const minutes=(parts[1]||'30').replace(/[^\d]/g,'')||'30';
  let priority=(parts[2]||'P1').toUpperCase().replace(/[^P012]/g,'');
  if(!['P0','P1','P2'].includes(priority)){
    const m=String(line).match(/\b(P0|P1|P2)\b/i);
    priority=m?m[1].toUpperCase():'P1';
  }
  const difficulty=clampDiff(parts[3]||3);
  let type=parts[4]||'';
  if(!TASK_TYPES.includes(type))type=inferType(name,'');
  const subtasks=(parts[5]||'').split(/[;；]/).map(s=>s.trim()).filter(Boolean).slice(0,6);
  return {name,minutes,priority,difficulty,type,subtasks};
}
function isVagueTask(name){

function goalAnchoredSpecs(p, date, rate, ctx){
  const goal=p.goal||p.name||'当前目标';
  const pr=planProfile(p);
  const under=ctx&&ctx.underStreak!=null?ctx.underStreak:(S.stats.consecutiveUnder||0);
  const blob=((ctx&&ctx.difficulties)||'')+((ctx&&ctx.taskNotes)||'')+((ctx&&ctx.selfSummary)||'');
  const hard=rate<0.5||under>=2||/困难|不会|卡住|太难|跟不上/.test(blob);
  const strong=rate>=0.8&&!hard&&under<2;
  let n=strong?5:hard?3:4;
  if(under>=3)n=2;
  if((p.intensity||1)>=1.25&&!hard)n=Math.min(6,n+1);
  if((p.intensity||1)<=0.8)n=Math.max(2,n-1);
  if(S.restDates[date]==='half')n=Math.max(1,Math.ceil(n/2));
  const bank=concreteBank(goal,pr,hard?'hard':strong?'strong':'steady');
  const seed=hashDate(date+(p.id||goal));
  const specs=[];
  let remain=pr.dailyMinutes;
  for(let i=0;i<n;i++){
    const item=bank[(seed+i)%bank.length];
    const minutes=i===n-1?Math.max(8,remain):Math.max(8,Math.round(pr.dailyMinutes/n));
    remain-=minutes;
    let difficulty=strong?4:hard?2:3;
    if(strong&&i===0)difficulty=5;
    if(hard)difficulty=i===0?2:1;
    let priority=i===0?'P0':i<n-1?'P1':'P2';
    if(hard&&i>0)priority='P2';
    specs.push({
      name:item.name,
      minutes:String(minutes),
      priority,
      difficulty,
      type:item.type||inferType(item.name,''),
      subtasks:item.subs.slice()
    });
  }
  return specs;
}

let lastAIFallback=false;
function getDeepSeekKey(){
  return String((S&&S.settings&&S.settings.apiKey)||DEEPSEEK_API_KEY||'').trim();

async function callDeepSeek(systemPrompt,userPrompt,proxyBody){
  const proxy=(S.settings&&S.settings.proxyUrl||'').trim();
  const key=getDeepSeekKey();
  const ctrl=typeof AbortController!=='undefined'?new AbortController():null;
  const timer=ctrl?setTimeout(()=>ctrl.abort(),40000):null;
  try{
    if(key){
      const res=await fetch(DEEPSEEK_API_URL,{
        method:'POST',
        signal:ctrl?ctrl.signal:undefined,
        headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
        body:JSON.stringify({
          model:'deepseek-chat',
          temperature:0.75,
          messages:[
            {role:'system',content:systemPrompt},
            {role:'user',content:userPrompt}
          ]
        })
      });
      if(!res.ok){
        const errText=await res.text().catch(()=> '');
        throw new Error('DeepSeek API '+res.status+' '+(errText||'').slice(0,120));
      }
      const data=await res.json();
      const text=data&&data.choices&&data.choices[0]&&data.choices[0].message&&data.choices[0].message.content;
      if(!text)throw new Error('empty response from DeepSeek');
      return String(text).trim();
    }
    if(proxy){
      const res=await fetch(proxy,{
        method:'POST',
        signal:ctrl?ctrl.signal:undefined,
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify(proxyBody||{systemPrompt,userPrompt})
      });
      if(!res.ok)throw new Error('proxy '+res.status);
      const data=await res.json();
      if(data.error)throw new Error(data.error);
      if(!data.content)throw new Error('empty');
      return String(data.content).trim();
    }
    throw new Error('nokey');
  }finally{
    if(timer)clearTimeout(timer);
  }
}

/* ============ 任务生成 ============ */
function makeTask(planId,date,text,priority,minutes,extra){
  const o=extra&&typeof extra==='object'?extra:{};
  const plan=planById(planId);
  const t={
    id:uid(),planId,text,date,
    priority:priority||o.priority||'P1',
    minutes:String(minutes||o.minutes||30),
    status:'none',phase:'day',
    difficulty:clampDiff(o.difficulty||3),
    type:o.type||inferType(text,plan&&plan.category),
    skipped:!!o.skipped,extra:!!o.extra,
    order:o.order||0,source:o.source||'ai',
    subtasks:o.subtasks||[]
  };
  return normalizeTaskFields(t,plan);
}
function buildDailyTasks(p,date){
  const wk=weekKey(date);
  const wp=p.week_plan&&p.week_plan[wk];
  const specs=wp&&wp.dayPlans&&wp.dayPlans[date];
  if(specs&&specs.length)return specsToTasks(p,date,specs,wp.source||'ai');
  return specsToTasks(p,date,fallbackDaySpecs(p,date,0.7),'template');
}
function replacePlanDayTasks(p,date,specs,opt){
  opt=opt||{};
  const keepUser=!!opt.keepUser;
  const existing=(S.tasks[date]||[]).filter(t=>t.planId===p.id);
  const keep=keepUser?existing.filter(t=>t.extra||t.status==='done'||t.status==='partial'):[];
  const others=(S.tasks[date]||[]).filter(t=>t.planId!==p.id);
  const created=specsToTasks(p,date,specs,opt.source||'ai');
  created.forEach((t,i)=>{t.order=keep.length+i;});
  S.tasks[date]=others.concat(keep).concat(created);
  ensurePlanHierarchy(p);
  const wk=weekKey(date);
  if(!p.week_plan[wk])p.week_plan[wk]=fallbackWeekPlan(p,wk,0.7);
  p.week_plan[wk].dayPlans=p.week_plan[wk].dayPlans||{};
  p.week_plan[wk].dayPlans[date]=specs;
  save();
  return created;
}
function materializeWeekToTasks(p,wk){
  const wp=p.week_plan&&p.week_plan[wk];
  if(!wp||!wp.dayPlans)return;
  weekDates(wk).forEach(d=>{
    if(S.restDates[d]==='full')return;
    if(S.settlements[d])return;
    const specs=wp.dayPlans[d];
    if(!specs||!specs.length)return;
    const ex=(S.tasks[d]||[]).filter(t=>t.planId===p.id);
    if(ex.length)return;
    S.tasks[d]=(S.tasks[d]||[]).concat(specsToTasks(p,d,specs,wp.source||'ai'));
  });
}
async function ensureMonthPlan(p,date){
  ensurePlanHierarchy(p);
  const mk=monthKey(date);
  if(p.month_plan[mk]&&p.month_plan[mk].weekThemes&&p.month_plan[mk].weekThemes.length)return p.month_plan[mk];
  const mp=await generateMonthPlanWithAI(p,mk);
  p.month_plan[mk]=mp;
  save();
  return mp;
}
async function ensureWeekPlan(p,date){
  ensurePlanHierarchy(p);
  const wk=weekKey(date);
  if(p.week_plan[wk]&&p.week_plan[wk].dayPlans)return p.week_plan[wk];
  const prevWk=addDays(wk,-7);
  const prevRate=S.weeklyAvg[prevWk];
  const skipped=collectSkippedSummary(p,prevWk);
  const wp=await generateWeekPlanWithAI(p,wk,{rate:prevRate,skipped});
  p.week_plan[wk]=wp;
  materializeWeekToTasks(p,wk);
  save();
  return wp;
}
function collectSkippedSummary(p,wk){
  const names=[];
  weekDates(wk).forEach(d=>{
    (S.tasks[d]||[]).forEach(t=>{
      if(t.planId!==p.id)return;
      if(t.skipped||((t.status||'none')==='none'&&S.settlements[d]&&!S.settlements[d].rest))names.push(t.text);
    });
  });
  return names.slice(0,8).join('、')||'无';
}
function collectYesterdaySummary(p,date){
  const y=addDays(date,-1);
  const tasks=(S.tasks[y]||[]).filter(t=>t.planId===p.id);
  const df=S.dailyFeedback[y]||{};
  const base={
    taskNotes:collectDayFeedbackDigest(y,p.id),
    selfSummary:df.selfSummary||'',mood:df.mood||'',difficulties:df.difficulties||'',
    targetStreak:S.stats.targetStreak||0,underStreak:S.stats.consecutiveUnder||0
  };
  if(!tasks.length)return Object.assign({yesterday:'无',skipped:'无'},base);
  const yesterday=tasks.map(t=>{
    const subs=(t.subtasks||[]).map(s=>`${s.text}:${s.done?'完成':'未完成'}`).join('；');
    return `${t.text}[${t.status||'none'}${t.skipped?'/跳过':''}]`+(subs?` 子项:${subs}`:'');
  }).join('\n');
  const skipped=tasks.filter(t=>t.skipped).map(t=>t.text).join('、')||'无';
  return Object.assign({yesterday,skipped},base);
}
async function syncHierarchy(date){
  date=date||todayStr();
  const plans=activePlans();
  for(let i=0;i<plans.length;i++){
    const p=plans[i];
    try{
      await ensureMonthPlan(p,date);
      await ensureWeekPlan(p,date);
      const ex=(S.tasks[date]||[]).filter(t=>t.planId===p.id);
      if(!ex.length&&S.restDates[date]!=='full'&&!(S.settlements[date]&&S.settlements[date].rest)){
        S.tasks[date]=(S.tasks[date]||[]).concat(buildDailyTasks(p,date));
      }
    }catch(e){console.warn('syncHierarchy',p.name,e);}
  }
  save();
}
function ensureDay(date){
  if(S.restDates[date]==='full')return;
  if(S.settlements[date]&&S.settlements[date].rest)return;
  activePlans().forEach(p=>{
    ensurePlanHierarchy(p);
    const ex=(S.tasks[date]||[]).filter(t=>t.planId===p.id);
    if(ex.length)return;
    S.tasks[date]=(S.tasks[date]||[]).concat(buildDailyTasks(p,date));
  });
  save();
}
function ensureToday(){ensureDay(todayStr());}

function createPlan(name,category,mode,goal,templates,ms,cycle,extra){
  const tpl=(templates&&templates.length)?templates:pickTemplates(goal);
  const o=extra&&typeof extra==='object'?extra:{};
  const p={
    id:uid(),name,category,mode:mode||'B',templates:tpl.map(t=>({
      name:t.name||t.text,minutes:t.minutes||'30',priority:t.priority||'P1',
      difficulty:clampDiff(t.difficulty),type:t.type||inferType(t.name||t.text,category),
      subtasks:t.subtasks||[]
    })),
    ms:(ms&&ms.length)?ms:milestones(goal),
    goal,intensity:1,createdAt:todayStr(),color:pickColor(),
    cycle:cycle||'月',status:'active',
    profile:o.profile||{dailyMinutes:60,foundation:'',preference:''},
    month_plan:o.month_plan||{},
    week_plan:o.week_plan||{}
  };
  ensurePlanHierarchy(p);
  S.plans.push(p);save();
  const wk=weekKey(todayStr());
  if(p.week_plan[wk])materializeWeekToTasks(p,wk);
  else ensureDay(todayStr());
  return p;
}

/* ============ 结算与动态调整 ============ */
function adjustPlan(p,rate){
  const before=p.intensity||1;
  if(rate>=0.8)p.intensity=Math.min(2.5,+(before*UP[p.mode]).toFixed(3));
  else if(rate<0.5)p.intensity=Math.max(0.4,+(before*DOWN[p.mode]).toFixed(3));
  return before;
}
function adjLabel(rate,mode){
  if(rate>=0.8)return '加量 '+MODES[mode].up;
  if(rate>=0.5)return '持平';
  return '减量 '+MODES[mode].down;
}
function addTitle(e,n){const s=e+' '+n;if(!S.titles.includes(s))S.titles.push(s);}
function hasTitle(e,n){return S.titles.includes(e+' '+n);}
function streakTargetDays(){
  let n=0;const t=todayStr();
  for(let i=1;i<365;i++){
    const r=S.settlements[addDays(t,-i)];
    if(!r||r.rest)break;
    if(r.rate>=0.8)n++;else break;
  }
  return n;
}

function feedbackBits(fb){
  if(!fb)return '';
  const bits=[];
  if(fb.feeling)bits.push('感想:'+fb.feeling);
  if(fb.timeSpent)bits.push('用时:'+fb.timeSpent+'分钟');
  if(fb.difficulty)bits.push('难度感受:'+fb.difficulty);
  if(fb.problems)bits.push('问题:'+fb.problems);
  return bits.join('，');
}
function collectDayFeedbackDigest(date, planId){
  const lines=[];
  (S.tasks[date]||[]).forEach(t=>{
    if(planId&&t.planId!==planId)return;
    const fb=feedbackBits(S.taskFeedback[t.id]);
    const subs=(t.subtasks||[]).map(s=>{
      const sf=feedbackBits(S.taskFeedback[s.id]);
      return s.text+(s.done?'完成':'未完成')+(sf?'（'+sf+'）':'');
    }).join('；');
    if(fb||subs||t.status)lines.push(`${t.text}[${t.status||'none'}]${fb?' '+fb:''}${subs?' 子项:'+subs:''}`);
  });
  return lines.join('\n')||'无';
}
function datesOfMonth(mk){
  const [y,m]=mk.split('-').map(Number);
  const n=new Date(y,m,0).getDate();
  const out=[];
  for(let d=1;d<=n;d++)out.push(mk+'-'+String(d).padStart(2,'0'));
  return out;
}
function typeStatsForDates(dates){
  const map={};
  dates.forEach(d=>{
    (S.tasks[d]||[]).forEach(t=>{
      if(t.skipped)return;
      const tp=t.type||'其他';
      if(!map[tp])map[tp]={total:0,done:0,partial:0,hard:0};
      map[tp].total++;
      if((t.status||'none')==='done')map[tp].done++;
      else if(t.status==='partial')map[tp].partial++;
      const bump=fb=>{if(fb&&(fb.difficulty==='困难'||fb.problems))map[tp].hard++;};
      bump(S.taskFeedback[t.id]);
      (t.subtasks||[]).forEach(s=>bump(S.taskFeedback[s.id]));
    });
  });
  return map;
}
function typeLine(map){
  const keys=Object.keys(map||{});
  if(!keys.length)return '暂无任务类型数据';
  return keys.map(k=>{
    const t=map[k];
    return `${k}完成 ${t.done}/${t.total}`+(t.hard?`，困难反馈 ${t.hard} 次`:'');
  }).join('；');
}
function longestTargetStreakIn(dates){
  let best=0,cur=0;
  dates.forEach(d=>{
    const r=S.settlements[d];
    if(r&&!r.rest&&r.rate>=0.8){cur++;best=Math.max(best,cur);}
    else cur=0;
  });
  return best;
}
function feelingLines(dates){
  return dates.map(d=>{
    const f=S.dailyFeedback[d];
    if(!f||(!f.selfSummary&&!f.difficulties))return '';
    return `${d}（${f.mood||'一般'}）${f.selfSummary||''}${f.difficulties?' 困难：'+f.difficulties:''}`;
  }).filter(Boolean);
}
function buildWeeklySummary(wk){
  const dates=weekDates(wk).filter(d=>d<=todayStr());
  const recs=dates.map(d=>S.settlements[d]).filter(r=>r&&!r.rest&&typeof r.rate==='number');
  const avg=recs.length?recs.reduce((a,r)=>a+r.rate,0)/recs.length:(S.weeklyAvg[wk]||0);
  const types=typeStatsForDates(dates);
  const feelings=feelingLines(dates);
  const longest=longestTargetStreakIn(dates);
  const summary=`周完成率 ${Math.round(avg*100)}%。最长连续达标 ${longest} 天。各类型：${typeLine(types)}。每周感想：${feelings.join(' / ')||'本周还没有写下感想'}`;
  const prev=S.weeklySummary[wk]||{};
  return {week:wk,summary,aiFeedback:prev.aiFeedback||'',rate:avg,longestStreak:longest,typeStats:types,feelings:feelings.join('\n')};
}
function buildMonthlySummary(mk){
  const dates=datesOfMonth(mk).filter(d=>d<=todayStr());
  const recs=dates.map(d=>S.settlements[d]).filter(r=>r&&!r.rest&&typeof r.rate==='number');
  const avg=recs.length?recs.reduce((a,r)=>a+r.rate,0)/recs.length:(S.monthlyAvg[mk]||0);
  const types=typeStatsForDates(dates);
  const feelings=feelingLines(dates);
  const longest=longestTargetStreakIn(dates);
  const summary=`月完成率 ${Math.round(avg*100)}%。最长连续达标 ${longest} 天。各类型：${typeLine(types)}。月内感想：${feelings.slice(0,8).join(' / ')||'本月还没有写下感想'}`;
  const prev=S.monthlySummary[mk]||{};
  return {month:mk,summary,aiFeedback:prev.aiFeedback||'',rate:avg,longestStreak:longest,typeStats:types,feelings:feelings.join('\n')};
}
function localCoachFeedback(kind, payload){
  const rate=Math.round((Number(payload.rate)||0)*100);
  const notes=payload.taskNotes||'';
  const diff=payload.difficulties||'';
  const hard=/困难/.test(notes+' '+diff)||(payload.underStreak||0)>=2;
  if(kind==='day'){
    let s=`今天加权完成率 ${rate}%。`;
    if(payload.mood)s+=`你把状态记成「${payload.mood}」。`;
    if(payload.selfSummary)s+=`你的总结是：「${String(payload.selfSummary).slice(0,80)}」。`;
    if(diff)s+=`你遇到的困难是：「${String(diff).slice(0,80)}」。`;
    if(notes&&notes!=='无')s+=`任务反馈里写到：${String(notes).replace(/\n/g,' ').slice(0,140)}。`;
    if((payload.underStreak||0)>=3)s+='已经连续多天没达标，建议明天休息或改成半量，并把任务拆成更小的步骤。';
    else if(hard||rate<50)s+='困难比较集中，明天会降低难度、拆开子项，而不是只减少条数。';
    else if(rate>=80)s+='完成率和质量都不错，明天会在同一个目标上加一点可核对的挑战。';
    else s+='节奏还在。明天保持相近的时间，并针对你写下的问题换一种做法。';
    return s;
  }
  if(kind==='week'){
    let s=`上周完成率 ${rate}%，最长连续达标 ${payload.longestStreak||0} 天。`;
    if(payload.typeLine)s+=payload.typeLine+'。';
    if(payload.feelings)s+=`你这周写过：${String(payload.feelings).slice(0,140)}。`;
    if(hard||rate<50)s+='下周会把反复觉得困难的部分拆小，并降低难度。';
    else if(rate>=80)s+='下周可以适度进阶，把时间更多放在你完成得最好的内容上。';
    else s+='下周先稳住任务量，侧重点收回到最影响结果的一块。';
    return s;
  }
  let s=`上月完成率 ${rate}%，最长连续达标 ${payload.longestStreak||0} 天。`;
  if(payload.typeLine)s+=payload.typeLine+'。';
  if(payload.feelings)s+=`月内感想：${String(payload.feelings).slice(0,160)}。`;
  s+=rate>=80?'下月目标可以上调一档，每天仍然要有可打勾的具体结果。':'下月先收窄目标，把每天的任务拆得更具体。';
  return s;
}

function findTask(date,id){
  const t=(S.tasks[date]||[]).find(x=>x.id===id);
  if(t)return {task:t,sub:null};
  let found=null;
  (S.tasks[date]||[]).some(task=>{

function settleDay(feedback){
  const d=todayStr();
  if(S.settlements[d]){toast('今日已经结算过了');return;}
  const tasks=todayTasks(d);
  const rate=tasks.length?weightedRate(tasks):1;
  const adjustments=[];
  activePlans().forEach(p=>{
    const pt=tasks.filter(t=>t.planId===p.id);
    if(!pt.length)return;
    const pr=weightedRate(pt);
    const from=adjustPlan(p,pr);
    adjustments.push({name:p.name,mode:p.mode,rate:pr,from,to:p.intensity,label:adjLabel(pr,p.mode)});
  });
  let pts=0,type='low',titleUnlock=null,achUnlock=null;
  if(rate>=1){type='perfect';pts=3;}
  else if(rate>=0.8){type='target';pts=2;}
  else if(rate>=0.5){type='progress';pts=1;}
  const engineDaily=applyEngineDailyBonus(rate);
  pts+=engineDaily;

  if(rate>=1){
    S.stats.perfectStreak=(S.stats.perfectStreak||0)+1;
    if(S.stats.perfectStreak===3){pts+=5;addTitle('🔥','连击达人');titleUnlock=['🔥','连击达人'];}
    if(S.stats.perfectStreak===5){pts+=10;if(!hasTitle('⚡','黄金战士')){addTitle('⚡','黄金战士');titleUnlock=titleUnlock||['⚡','黄金战士'];}}
    if(!S.stats.first100){pts+=5;achUnlock='🎯 初战告捷';S.stats.first100=true;S.achievements.push(achUnlock);}
  }else if(tasks.length){S.stats.perfectStreak=0;}

  if(rate>=0.8)S.stats.targetStreak=(S.stats.targetStreak||0)+1;
  else if(tasks.length)S.stats.targetStreak=0;

  if(rate<0.5&&tasks.length)S.stats.consecutiveUnder++;else S.stats.consecutiveUnder=0;
  S.stats.recommendRest=S.stats.consecutiveUnder>=3;

  const tomorrow=addDays(d,1);
  let bonusHalf=false;
  if((S.stats.targetStreak||0)>=3&&S.restDates[tomorrow]!=='full'){
    S.restDates[tomorrow]='half';
    bonusHalf=true;
  }

  S.dailyFeedback[d]={
    date:d,
    selfSummary:(feedback&&feedback.selfSummary)||'',
    mood:(feedback&&feedback.mood)||'一般',
    difficulties:(feedback&&feedback.difficulties)||'',
    aiFeedback:'',
    taskDigest:collectDayFeedbackDigest(d)
  };
  S.settlements[d]={rate,points:pts,type,rest:false,adjustments,engineDaily,changeLog:S.changeLogs[d]||[]};
  S.points+=pts;
  save();
  checkPeriod(d);
  beginCoachReview({rate,pts,type,titleUnlock,achUnlock,adjustments,bonusHalf,engineDaily,date:d});
}

function startHalfDay(){
  const d=todayStr();
  if(S.settlements[d]){toast('今日已结算，无法再改');return;}
  S.restDates[d]='half';
  S.plans.forEach(p=>{
    const list=(S.tasks[d]||[]).filter(t=>t.planId===p.id);
    if(list.length<=1)return;
    const keep=Math.max(1,Math.ceil(list.length/2));
    const sorted=list.slice().sort((a,b)=>priRank(a)-priRank(b));
    const drop=new Set(sorted.slice(keep).map(t=>t.id));
    S.tasks[d]=(S.tasks[d]||[]).filter(t=>t.planId!==p.id||!drop.has(t.id));
  });
  save();render();toast('已开启半量日，优先保留 P0 任务');
}

function checkPeriod(d){
  const wk=weekKey(d);
  if(S.lastWeek&&S.lastWeek!==wk){
    settleWeek(S.lastWeek);
    regenWeekAsync(d,S.lastWeek);
  }
  S.lastWeek=wk;
  const mk=monthKey(d);
  if(S.lastMonth&&S.lastMonth!==mk){
    settleMonth(S.lastMonth);
    regenMonthAsync(d,S.lastMonth);
  }
  S.lastMonth=mk;
  save();
}
async function draftNextDay(d, rate){
  const tomorrow=addDays(d,1);
  if(S.restDates[tomorrow]==='full')return {date:tomorrow,from:d,plans:[],rest:'full'};
  const plans=[];
  const active=activePlans();
  for(let i=0;i<active.length;i++){
    const p=active[i];
    const ctx=collectYesterdaySummary(p,tomorrow);
    ctx.rate=rate;
    ctx.changes=(S.changeLogs[d]||[]).filter(x=>x.planId===p.id).map(x=>x.action+':'+(x.text||'')).join('、')||'无';
    try{
      const out=await generateNextDayWithAI(p,tomorrow,ctx);
      plans.push({planId:p.id,name:p.name,reason:out.reason,label:adjLabel(rate,p.mode),specs:out.specs,source:out.source||'ai'});
    }catch(e){console.warn('draftNextDay',e);}
  }
  return {date:tomorrow,from:d,plans};
}

async function regenWeekAsync(today,prevWk){
  const avg=S.weeklyAvg[prevWk];
  const sum=S.weeklySummary[prevWk];
  const plans=activePlans();
  for(let i=0;i<plans.length;i++){
    const p=plans[i];
    try{
      const wk=weekKey(today);
      const skipped=collectSkippedSummary(p,prevWk);
      const taskNotes=weekDates(prevWk).map(d=>collectDayFeedbackDigest(d,p.id)).filter(x=>x!=='无').join('\n');
      p.week_plan[wk]=await generateWeekPlanWithAI(p,wk,{
        rate:avg,skipped,summary:sum&&sum.summary,feelings:sum&&sum.feelings,taskNotes
      });
      weekDates(wk).forEach(d=>{
        if(d<today)return;
        if(S.settlements[d])return;
        if(S.pendingNextDay&&S.pendingNextDay.date===d)return;
        const specs=p.week_plan[wk].dayPlans[d];
        if(specs)replacePlanDayTasks(p,d,specs,{keepUser:true,source:p.week_plan[wk].source});
      });
    }catch(e){console.warn('regenWeek',e);}
  }
  save();
}
async function regenMonthAsync(today,prevMk){
  const avg=S.monthlyAvg[prevMk];
  const sum=S.monthlySummary[prevMk];
  const mk=monthKey(today);
  const plans=activePlans();
  for(let i=0;i<plans.length;i++){
    const p=plans[i];
    try{
      p.month_plan[mk]=await generateNextMonthWithAI(p,mk,avg,{summary:sum&&sum.summary,feelings:sum&&sum.feelings});
      const wk=weekKey(today);
      p.week_plan[wk]=await generateWeekPlanWithAI(p,wk,{
        rate:avg,
        skipped:collectSkippedSummary(p,weekKey(addDays(today,-1))),
        summary:sum&&sum.summary,
        feelings:sum&&sum.feelings
      });
      weekDates(wk).forEach(d=>{
        if(d<today||S.settlements[d])return;
        if(S.pendingNextDay&&S.pendingNextDay.date===d)return;
        const specs=p.week_plan[wk].dayPlans[d];
        if(specs)replacePlanDayTasks(p,d,specs,{keepUser:true,source:p.week_plan[wk].source});
      });
    }catch(e){console.warn('regenMonth',e);}
  }
  save();
}

function coerceNumber(v){
  if(typeof v==='number'&&isFinite(v))return Math.round(v);
  if(typeof v==='string'&&v.trim()&&isFinite(Number(v)))return Math.round(Number(v));
  return null;
}
function importScore(v){
  if(Array.isArray(v))return v.length;
  if(v&&typeof v==='object')return Object.keys(v).length;
  return -1;
}
function preferImport(a,b){
  return importScore(a)>=importScore(b)?a:b;
}
function coerceRate(v){
  if(typeof v==='string'&&v.trim())v=Number(v);
  if(typeof v!=='number'||!isFinite(v))return null;
  if(v>1&&v<=100)return v/100;
  if(v<0)return 0;
  if(v>1)return 1;
  return v;
}
function coerceTaskMap(raw, lost){
  const map={};
  if(raw==null)return map;
  if(Array.isArray(raw)){
    raw.forEach((t,i)=>{
      if(!t||typeof t!=='object'){lost.push('第 '+(i+1)+' 条任务不是对象，已跳过');return;}
      const d=String(t.date||t.day||'');
      if(!/^\d{4}-\d{2}-\d{2}$/.test(d)){lost.push('有一条任务缺少有效日期，已跳过');return;}
      if(!map[d])map[d]=[];
      map[d].push(t);
    });
    return map;
  }
  if(typeof raw==='object'){
    Object.keys(raw).forEach(k=>{
      const arr=raw[k];
      if(!Array.isArray(arr)){lost.push(k+' 的任务不是列表，这一天已跳过');return;}
      const ok=arr.filter(t=>t&&typeof t==='object');
      if(ok.length<arr.length)lost.push(k+' 有 '+(arr.length-ok.length)+' 条无法识别的任务，已跳过');
      if(/^\d{4}-\d{2}-\d{2}$/.test(k))map[k]=ok;
      else if(ok.length)lost.push('日期「'+k+'」无法识别，该日任务已跳过');
    });
    return map;
  }
  lost.push('任务区格式无法识别，任务未导入');
  return map;
}
function coerceRecordMap(raw, lost, label){
  const map={};
  if(raw==null)return map;
  if(typeof raw!=='object'||Array.isArray(raw)){lost.push(label+'不是按日期存放的记录，已跳过');return map;}
  Object.keys(raw).forEach(k=>{
    const rec=raw[k];
    if(!rec||typeof rec!=='object'||Array.isArray(rec)){lost.push(label+'里 '+k+' 无法识别，已跳过');return;}
    const copy=Object.assign({},rec);
    const rate=coerceRate(copy.rate!=null?copy.rate:copy.completionRate);
    if(rate!=null)copy.rate=rate;
    if(copy.rest==null)copy.rest=copy.type==='rest';
    map[k]=copy;
  });
  return map;
}
function coerceTitles(raw, lost){
  const out=[];
  if(raw==null)return ['🌱 新手启程'];
  if(!Array.isArray(raw)){lost.push('称号格式无法识别，已保留默认称号');return ['🌱 新手启程'];}
  raw.forEach(t=>{
    if(typeof t==='string'&&t.trim())out.push(t.trim());
    else if(t&&typeof t==='object'){
      const name=(t.n||t.name||'').trim();
      if(name)out.push(((t.e||t.emoji||'')+' '+name).trim());
    }
  });
  if(!out.length){lost.push('称号列表是空的，已保留默认称号');return ['🌱 新手启程'];}
  if(!out.some(t=>t.includes('新手启程')))out.unshift('🌱 新手启程');
  return out;
}
function coercePlans(raw, lost){
  if(raw==null)return [];
  if(!Array.isArray(raw)){lost.push('计划列表格式无法识别，计划未导入');return [];}
  const out=[];
  raw.forEach((p,i)=>{
    if(!p||typeof p!=='object'||Array.isArray(p)){lost.push('第 '+(i+1)+' 个计划无法识别，已跳过');return;}
    if(!p.id)p.id='legacy'+i+uid();
    out.push(p);
  });
  return out;
}
function linkOrphanTasks(plans, tasks, lost){
  const ids=new Set(plans.map(p=>p.id));
  let orphans=0;
  Object.keys(tasks).forEach(d=>{
    (tasks[d]||[]).forEach(t=>{
      if(!t.planId&&plans.length===1)t.planId=plans[0].id;
      else if(t.planId&&!ids.has(t.planId))orphans++;
    });
  });
  if(orphans)lost.push(orphans+' 条任务找不到对应计划，导入后不会出现在今日列表里');
}
function normalizeImported(obj){
  const notes=[];
  const lost=[];
  try{
    if(typeof obj==='string'){
      try{obj=JSON.parse(obj);}catch(e){
        return {ok:false,message:'文件内容多包了一层文字，里面不是合法 JSON。',lost:['全部数据都未导入，当前本地数据没有改动']};
      }
    }
    if(!obj||typeof obj!=='object'||Array.isArray(obj)){
      return {ok:false,message:'这个文件不是智能计划教练的备份对象。',lost:['全部数据都未导入，当前本地数据没有改动']};
    }
    const base=obj.app==='smart-plan-coach'&&obj.data&&typeof obj.data==='object'&&!Array.isArray(obj.data)?obj.data:{};
    const fromVersion=Number(obj.version||base.version||0);
    if(!fromVersion||fromVersion<5)notes.push('识别为旧版备份，已自动补上新字段的默认值');
    const plans=coercePlans(preferImport(obj.plans, base.plans), lost);
    const tasks=coerceTaskMap(preferImport(obj.tasks, base.tasks), lost);
    const settlements=coerceRecordMap(
      preferImport(preferImport(obj.dailyRecords, obj.settlements), preferImport(base.dailyRecords, base.settlements)),
      lost,'每日结算');
    const points=coerceNumber(obj.points!=null?obj.points:obj.userPoints!=null?obj.userPoints:base.points!=null?base.points:base.userPoints);
    if(points==null&&(obj.points!=null||obj.userPoints!=null||base.points!=null||base.userPoints!=null)){
      lost.push('积分不是有效数字，已按 0 导入');
    }
    const titles=coerceTitles(preferImport(obj.titles, base.titles), lost);
    let incentives=preferImport(obj.incentives, base.incentives);
    if(incentives==null)incentives=[];
    else if(!Array.isArray(incentives)){lost.push('激励库格式无法识别，激励条目未导入');incentives=[];}
    else{
      const ok=incentives.filter(it=>it&&typeof it==='object');
      if(ok.length<incentives.length)lost.push('激励库有 '+(incentives.length-ok.length)+' 条无法识别，已跳过');
      incentives=ok;
    }
    let exLog=preferImport(preferImport(obj.rewardLog, obj.exLog), preferImport(base.rewardLog, base.exLog));
    if(!Array.isArray(exLog))exLog=[];
    const state=Object.assign(defState(),{
      version:5,
      points:points==null?0:points,
      titles,
      selTitle:typeof (obj.selTitle||base.selTitle)==='string'?(obj.selTitle||base.selTitle):null,
      achievements:Array.isArray(base.achievements)?base.achievements:Array.isArray(obj.achievements)?obj.achievements:[],
      plans,
      tasks,
      settlements,
      restDates:(base.restDates&&typeof base.restDates==='object'&&!Array.isArray(base.restDates))?base.restDates:{},
      changeLogs:preferImport(obj.changeLogs, base.changeLogs),
      weeklyDone:Array.isArray(base.weeklyDone)?base.weeklyDone:[],
      monthlyDone:Array.isArray(base.monthlyDone)?base.monthlyDone:[],
      weeklyAvg:(base.weeklyAvg&&typeof base.weeklyAvg==='object')?base.weeklyAvg:{},
      monthlyAvg:(base.monthlyAvg&&typeof base.monthlyAvg==='object')?base.monthlyAvg:{},
      stats:(base.stats&&typeof base.stats==='object')?Object.assign(defState().stats, base.stats):defState().stats,
      lastWeek:base.lastWeek||null,
      lastMonth:base.lastMonth||null,
      exLog,
      settings:(base.settings&&typeof base.settings==='object')?Object.assign({apiKey:'',proxyUrl:''}, base.settings):{apiKey:'',proxyUrl:''},
      incentives,
      rewardEngine:(base.rewardEngine&&typeof base.rewardEngine==='object')?base.rewardEngine:defState().rewardEngine,
      dailyFeedback:(base.dailyFeedback&&typeof base.dailyFeedback==='object')?base.dailyFeedback:(obj.dailyFeedback&&typeof obj.dailyFeedback==='object')?obj.dailyFeedback:{},
      taskFeedback:(base.taskFeedback&&typeof base.taskFeedback==='object')?base.taskFeedback:(obj.taskFeedback&&typeof obj.taskFeedback==='object')?obj.taskFeedback:{},
      weeklySummary:(base.weeklySummary&&typeof base.weeklySummary==='object')?base.weeklySummary:(obj.weeklySummary&&typeof obj.weeklySummary==='object')?obj.weeklySummary:{},
      monthlySummary:(base.monthlySummary&&typeof base.monthlySummary==='object')?base.monthlySummary:(obj.monthlySummary&&typeof obj.monthlySummary==='object')?obj.monthlySummary:{},
      pendingNextDay:base.pendingNextDay||obj.pendingNextDay||null
    });
    if(!state.changeLogs||typeof state.changeLogs!=='object'||Array.isArray(state.changeLogs))state.changeLogs={};
    if(!fromVersion||fromVersion<5){
      notes.push('旧版没有的日总结、任务反馈、周总结、月总结已用空记录补上');
      notes.push('任务若没有子项，会显示为一条完整任务，仍可勾选');
    }
    linkOrphanTasks(plans, tasks, lost);
    if(!plans.length&&importScore(tasks)<=0&&!Object.keys(settlements).length){
      return {ok:false,message:'没有找到计划、任务或结算记录。请确认文件是智能计划教练导出的 JSON。',lost:['全部数据都未导入，当前本地数据没有改动']};
    }
    state._importNotes=notes.concat(lost.map(x=>'需留意：'+x));
    return {ok:true,state,notes,lost};
  }catch(e){
    console.warn('normalizeImported',e);
    return {ok:false,message:'导入时发生异常：'+(e&&e.message?e.message:'未知错误'),lost:['为避免覆盖当前数据，这次导入已全部取消','请检查备份文件是否完整。计划、任务、积分和称号都还留在当前浏览器里']};
  }
}
function backupSummary(d){
  const planN=(d.plans||[]).length;
  const taskN=Object.keys(d.tasks||{}).reduce((n,k)=>n+(d.tasks[k]||[]).length,0);
  const recN=Object.keys(d.settlements||{}).length;
  const incN=(d.incentives||[]).length;
  return `计划 ${planN} 个 · 任务 ${taskN} 条 · 日记录 ${recN} 天<br>积分 ${d.points||0} · 称号 ${(d.titles||[]).length} · 激励库 ${incN} 条`;
}
async function exportData(){
  const filename='smart-plan-coach-backup-'+todayStr()+'.json';
  const text=JSON.stringify(buildBackup(),null,2);
  const blob=new Blob([text],{type:'application/json'});
  try{
    if(window.showSaveFilePicker){
      const handle=await window.showSaveFilePicker({
        suggestedName:filename,
        types:[{description:'JSON 备份',accept:{'application/json':['.json']}}]
      });
      const writable=await handle.createWritable();
      await writable.write(blob);
      await writable.close();
      toast('数据已导出');
      return;
    }
  }catch(e){
    if(e&&e.name==='AbortError')return;
  }
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=filename;
  document.body.appendChild(a);a.click();a.remove();
  URL.revokeObjectURL(url);
  toast('数据已导出到下载目录');
}
function applyImportedData(d){
  try{
    localStorage.setItem(KEY,JSON.stringify(d));
  }catch(e){toast('写入失败，存储空间可能已满');return;}
  toast('导入成功，即将刷新');
  setTimeout(()=>location.reload(),600);
}
function handleImportFile(e){
  const file=e.target.files&&e.target.files[0];
  e.target.value='';
  if(!file)return;
  if(!/\.json$/i.test(file.name)&&!/\.txt$/i.test(file.name)){toast('请选择 .json 备份文件');return;}
  const reader=new FileReader();
  reader.onload=()=>{
    let obj;
    try{obj=JSON.parse(reader.result);}
    catch(err){
      openModal(`<h3>导入失败</h3>
        <div class="sub">这个文件不是合法的 JSON，当前数据没有改动。</div>
        <div class="hint">可能丢失的内容：整份备份都没读进来。计划、任务、积分、称号和历史记录都还是现在浏览器里的这份。</div>
        <button class="btn btn-pri" data-action="close">知道了</button>`);
      return;
    }
    const result=normalizeImported(obj);
    if(!result||!result.ok){
      const lost=(result&&result.lost||['当前本地数据没有改动']).map(x=>esc(x)).join('<br>');
      openModal(`<h3>导入失败</h3>
        <div class="sub">${esc(result&&result.message||'无法识别这份备份')}</div>
        <div class="hint">可能丢失或未写入的内容：<br>${lost}</div>
        <button class="btn btn-pri" data-action="close">知道了</button>`);
      return;
    }
    pendingImport=result.state;
    const noteHtml=(result.notes||[]).map(x=>esc(x)).join('<br>');
    const lostHtml=(result.lost||[]).map(x=>esc(x)).join('<br>');
    openModal(`<h3>导入数据</h3>
      <div class="sub">将覆盖当前全部本地数据</div>
      <div class="hint">${backupSummary(result.state)}</div>
      ${noteHtml?`<div class="hint">${noteHtml}</div>`:''}
      ${lostHtml?`<div class="hint">这些内容无法完整带入：<br>${lostHtml}</div>`:'<div class="hint">计划、任务、积分、称号和每日结算都会保留。旧版没有的新字段会用默认值补上。</div>'}
      <button class="btn btn-pri" data-action="confirm-import">确认覆盖并导入</button>
      <button class="btn btn-ghost" data-action="cancel-import" style="margin-top:8px;">取消</button>`);
  };
  reader.onerror=()=>{
    openModal(`<h3>导入失败</h3>
      <div class="sub">文件没有读出来，当前数据没有改动。</div>
      <div class="hint">可能丢失的内容：没有。浏览器里现有的计划、任务、积分和称号都还在。</div>
      <button class="btn btn-pri" data-action="close">知道了</button>`);
  };
  reader.readAsText(file);
}

function dailySeries(n){
  const out=[],t=todayStr();
  for(let i=n-1;i>=0;i--){const d=addDays(t,-i);const r=S.settlements[d];
    out.push({label:i===0?'今':d.slice(8),value:r&&!r.rest?r.rate:0});}
  return out;
}
function lineChart(data){
  const W=320,H=160,pad=28;
  if(!data.length)return '<div class="empty">暂无数据</div>';
  const stepX=data.length>1?(W-2*pad)/(data.length-1):0;
  const pts=data.map((d,i)=>{const x=pad+(data.length>1?i*stepX:W/2);const y=H-pad-(d.value)*(H-2*pad);return[x,y];});
  const path=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  let grid='';
  [0,0.5,1].forEach(g=>{const y=H-pad-g*(H-2*pad);
    grid+=`<line x1="${pad}" y1="${y}" x2="${W-pad}" y2="${y}" stroke="#334155" stroke-width="1"/>
      <text x="${pad-4}" y="${y+3}" font-size="9" text-anchor="end">${g*100}%</text>`;});
  const circ=pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" fill="#4ea8ff"/>`).join('');
  const labs=data.map((d,i)=>`<text x="${pts[i][0].toFixed(1)}" y="${H-8}" font-size="9" text-anchor="middle">${d.label}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%">${grid}<path d="${path}" fill="none" stroke="#4ea8ff" stroke-width="2.4" stroke-linejoin="round"/>${circ}${labs}</svg>`;
}

function reorderTasks(date,fromId,toId){
  if(fromId===toId)return;
  const list=S.tasks[date]||[];
  const from=list.find(t=>t.id===fromId);const to=list.find(t=>t.id===toId);
  if(!from||!to||from.planId!==to.planId)return;
  const same=list.filter(t=>t.planId===from.planId).sort((a,b)=>(a.order||0)-(b.order||0));
  const fi=same.findIndex(t=>t.id===fromId);const ti=same.findIndex(t=>t.id===toId);
  if(fi<0||ti<0)return;
  same.splice(ti,0,same.splice(fi,1)[0]);
  same.forEach((t,i)=>t.order=i);
  logChange(date,{action:'reorder',planId:from.planId,taskId:fromId,text:from.text,detail:'调整任务顺序'});
  save();render();
}
function moveTask(date,id,dir){
  const list=(S.tasks[date]||[]).filter(t=>true);
  const t=list.find(x=>x.id===id);if(!t)return;
  const same=list.filter(x=>x.planId===t.planId).sort((a,b)=>(a.order||0)-(b.order||0));
  const i=same.findIndex(x=>x.id===id);const j=i+Number(dir);
  if(j<0||j>=same.length)return;
  const tmp=same[i].order;same[i].order=same[j].order;same[j].order=tmp;
  logChange(date,{action:'reorder',planId:t.planId,taskId:id,text:t.text,detail:Number(dir)<0?'上移':'下移'});
  save();render();
}
function skipTask(date,id){

    .map(x=>({name:x.text,minutes:x.minutes,priority:x.priority,difficulty:x.difficulty,type:x.type,subtasks:(x.subtasks||[]).map(s=>({id:s.id,text:s.text,done:!!s.done}))}));
  p.week_plan[wk].dayPlans=p.week_plan[wk].dayPlans||{};
  p.week_plan[wk].dayPlans[t.date]=specs;

function rebalanceAfterAdd(date,planId){
  const all=(S.tasks[date]||[]).filter(t=>t.planId===planId);
  const extra=all.filter(t=>t.extra&&(t.status||'none')==='none'&&!t.skipped);
  const rest=all.filter(t=>!t.extra&&(t.status||'none')==='none'&&!t.skipped);
  if(!extra.length||!rest.length)return;
  let left=Math.round(extra.reduce((s,t)=>s+(parseInt(t.minutes,10)||0),0)*0.5);
  rest.filter(t=>t.priority==='P2').concat(rest.filter(t=>t.priority==='P1')).forEach(t=>{
    if(left<=0)return;
    const cur=parseInt(t.minutes,10)||30;
    const next=Math.max(10,cur-Math.min(15,left));
    left-=(cur-next);
    t.minutes=String(next);
  });
  logChange(date,{action:'rebalance',planId,text:'临时任务加入后压缩当日其他任务时长'});
}

function setTaskStatus(date,id,st,opt){
  const t=(S.tasks[date]||[]).find(x=>x.id===id);if(!t)return;
  if(t.skipped&&st!=='none')t.skipped=false;
  const wasDone=(t.status||'none')==='done';
  t.status=st;t.done=st==='done';
  if(st==='done')(t.subtasks||[]).forEach(s=>{s.done=true;});
  if(st==='none')(t.subtasks||[]).forEach(s=>{s.done=false;});
  const ask=!opt||!opt.silent;
  if(t.done&&!wasDone)onTaskCompletedChange(t,true,{deferRecommend:ask&&(st==='done'||st==='partial')});
  else if(wasDone&&!t.done)onTaskCompletedChange(t,false);
  save();
  render();
  if(ask&&(st==='done'||st==='partial'))openTaskFeedback(date,id);
}
function toggleSubtask(date,taskId,subId){
  const t=(S.tasks[date]||[]).find(x=>x.id===taskId);if(!t||S.settlements[date])return;
  const s=(t.subtasks||[]).find(x=>x.id===subId);if(!s)return;
  s.done=!s.done;
  const doneN=(t.subtasks||[]).filter(x=>x.done).length;
  const all=(t.subtasks||[]).length;
  const next=doneN===0?'none':doneN===all?'done':'partial';
  const wasDone=(t.status||'none')==='done';
  t.status=next;t.done=next==='done';t.skipped=false;
  if(next==='done'&&!wasDone)onTaskCompletedChange(t,true,{deferRecommend:true});
  else if(wasDone&&next!=='done')onTaskCompletedChange(t,false);
  save();render();
  if(s.done)openTaskFeedback(date,subId);
}
function cycleTaskStatus(date,id){
  const t=(S.tasks[date]||[]).find(x=>x.id===id);if(!t)return;
  const next={none:'partial',partial:'done',done:'none'}[t.status||'none'];
  setTaskStatus(date,id,next);
}

    const id=el.dataset.id;
    S.plans=S.plans.filter(p=>p.id!==id);
    Object.keys(S.tasks).forEach(k=>S.tasks[k]=(S.tasks[k]||[]).filter(t=>t.planId!==id));
    save();render();return;
  }
  if(a==='exchange'){const ex=EXCHANGES.find(x=>x.cost===Number(el.dataset.cost));if(ex)doExchange(ex);return;}
  if(a==='sel-title'){S.selTitle=el.dataset.title;save();render();toast('已设为展示称号');return;}
  if(a==='reset'){openResetConfirm();return;}
  if(a==='confirm-reset'){clearAllAppData();return;}
  if(a==='export-data'){exportData();return;}
  if(a==='import-data'){const inp=$('importFile');inp.value='';inp.click();return;}
  if(a==='confirm-import'){
    const d=pendingImport;pendingImport=null;closeModal();
    if(d)applyImportedData(d);
    return;
  }
  if(a==='cancel-import'){pendingImport=null;closeModal();return;}
  if(a==='rewards-tab'){rewardsTab=el.dataset.tab;view='rewards';render();return;}
  if(a==='goto-library'){closeModal();rewardsTab='library';view='rewards';render();return;}
  if(a==='inc-upload'){triggerIncDocx();return;}
  if(a==='inc-add'){openIncentiveModal(null);return;}
  if(a==='inc-edit'){const it=S.incentives.find(x=>x.id===el.dataset.id);if(it)openIncentiveModal(it);return;}
  if(a==='inc-del'){deleteIncentive(el.dataset.id);return;}
  if(a==='inc-type'){incTypeFilter=el.dataset.type||'all';render();return;}
  if(a==='redeem-inc'){redeemIncentive(el.dataset.id);return;}
  if(a==='show-recs'){showIncentiveRecommend(S.rewardEngine.totalCompleted||0);return;}
  if(a==='inc-weight')return;
});
$('ov').addEventListener('click',e=>{if(e.target===$('ov')){pendingImport=null;closeModal();}});
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>{view=b.dataset.view;render();}));
if($('importFile'))$('importFile').addEventListener('change',handleImportFile);
if($('hPts'))$('hPts').addEventListener('animationend',e=>{if(e.animationName==='ptsBounce')e.target.classList.remove('pts-pop');});
document.addEventListener('input',e=>{
  if(e.target.id==='incSearchInput'){
    incSearch=e.target.value;
    const pos=e.target.selectionStart;
    render();
    const inp=$('incSearchInput');
    if(inp){inp.focus();try{inp.setSelectionRange(pos,pos);}catch(err){}}
    return;
  }
  if(e.target.dataset&&e.target.dataset.action==='inc-weight'){
    const it=S.incentives.find(x=>x.id===e.target.dataset.id);
    if(!it)return;
    it.weight=parseInt(e.target.value,10)||5;
    normalizeIncentive(it);
    save();
    const item=e.target.closest('.inc-item');
    if(item){
      const valEl=item.querySelector('.weight-val');
      const scoreEl=item.querySelector('.inc-tag.val');
      if(valEl)valEl.textContent=it.weight;
      if(scoreEl)scoreEl.textContent=calcValueScore(it).toFixed(1)+' 分';
    }
  }
});

(function init(){
  if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){
    window.addEventListener('load',function(){
      navigator.serviceWorker.register('./sw.js').catch(function(){});
    });
  }
  try{
    load();
    bindIncDocxIO();
    checkPeriod(todayStr());
    ensureToday();
    render();
    if(Array.isArray(S._importNotes)&&S._importNotes.length){
      const lines=S._importNotes.slice();
      S._importNotes=[];
      save();
      openModal(`<h3>备份已导入</h3>
        <div class="sub">旧版字段已做兼容，下面是处理说明。</div>
        <div class="hint">${lines.map(x=>esc(x)).join('<br>')}</div>
        <button class="btn btn-pri" data-action="close">去查看</button>`);
    }
    syncHierarchy(todayStr()).then(function(){render();}).catch(function(){});
  }catch(e){
    console.warn('初始化失败',e);
    try{toast('初始化失败。若刚导入备份，部分计划或任务可能无法显示。可在「数据」页重新导入；当前已显示的内容不一定完整。');}catch(err){}
  }
})();
</script>
